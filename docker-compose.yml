name: cipher-workbench

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ${BACKEND_CONTEXT:-../caesar-cipher-be}
      dockerfile: Dockerfile
    image: cipher-workbench-backend:${BACKEND_IMAGE_TAG:-local}
    labels:
      org.opencontainers.image.revision: ${BACKEND_REVISION:-c55278f207e84811cf26e3a748df612cd6a9915e}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cpus: ${BACKEND_CPUS:-1.0}
    mem_limit: ${BACKEND_MEMORY:-512m}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).read()
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging: *default-logging
    networks:
      - application

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FRONTEND_REVISION: ${FRONTEND_REVISION:-unknown}
    image: cipher-workbench-frontend:${FRONTEND_IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cpus: ${FRONTEND_CPUS:-0.5}
    mem_limit: ${FRONTEND_MEMORY:-128m}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging: *default-logging
    networks:
      - application

networks:
  application:
    driver: bridge
